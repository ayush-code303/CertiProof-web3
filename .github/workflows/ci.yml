name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-validation:
    name: Smart Contract Validation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./contracts
        run: npm ci

      - name: Run Contract Tests
        working-directory: ./contracts
        run: npx hardhat test

  backend-validation:
    name: Backend API Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check essential files
        working-directory: ./backend
        run: |
          [ -f "server.js" ] || exit 1
          [ -f "routes/certificate.js" ] || exit 1

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build application
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:5000
          REACT_APP_CHAIN_ID: 31337
          REACT_APP_NETWORK_NAME: Hardhat Local

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation files
        run: |
          [ -f "README.md" ] || exit 1
          [ -f "QUICKSTART.md" ] || exit 1
          [ -f ".env.example" ] || exit 1
          grep -q "CertiProof" README.md || exit 1

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [contract-validation, backend-validation, frontend-build, documentation-check]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "## 🎉 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: All validations and builds completed!" >> $GITHUB_STEP_SUMMARY
